<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  a { color: inherit; text-decoration: none; }
  .btn-primary { transition: transform .15s ease, background-color .15s ease; }
  .btn-primary:hover { transform: translateY(-1px); }
</style>
</helmet>

<div style="width:1280px;height:800px;position:relative;overflow:hidden;background:{{t.canvas}};background-image:radial-gradient(circle,{{t.subtle}} 1px,transparent 1px);background-size:28px 28px;display:flex;align-items:center;justify-content:center;">

  <div style="pointer-events:none;position:absolute;left:50%;bottom:-220px;width:640px;height:400px;transform:translateX(-50%);background:radial-gradient(ellipse at center,{{t.accentSoft}},transparent 65%);"></div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:28px;position:relative;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:20px;">
      <div style="width:22px;height:22px;border-radius:5px;background:{{t.accent}};transform:rotate(45deg);box-shadow:0 0 24px {{t.accentSoft}};"></div>
      <div style="text-align:center;">
        <h1 class="mono" style="margin:0;font-size:26px;font-weight:500;letter-spacing:-0.01em;color:{{t.ink}};">mitto</h1>
        <p style="margin:10px 0 0;font-size:14px;line-height:20px;color:{{t.sec}};">Deploy without managing infrastructure.</p>
      </div>
    </div>

    <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
      <p role="alert" style="display:flex;align-items:center;gap:10px;margin:0;border-radius:{{radius.md}};border:1px solid {{t.dangerBorder}};background:{{t.dangerBg}};color:{{t.danger}};padding:10px 16px;font-size:13px;">
        <span style="width:6px;height:6px;flex:none;border-radius:999px;background:{{t.danger}};"></span>
        That GitHub connection link expired or was invalid. Try connecting again.
      </p>
    </sc-if>

    <a href="#" class="btn-primary" style="display:inline-flex;align-items:center;gap:10px;border-radius:{{radius.md}};padding:11px 22px;font-size:14px;font-weight:600;background:{{t.ink}};color:{{t.canvas}};">
      Sign in with GitHub
    </a>

    <div style="display:flex;align-items:center;gap:8px;">
      <button onClick="{{toggleTheme}}" style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:{{radius.md}};border:1px solid {{t.border}};background:{{t.surface}};color:{{t.sec}};cursor:pointer;">
        <sc-if value="{{isBone}}" hint-placeholder-val="{{true}}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        </sc-if>
        <sc-if value="{{isGraphite}}" hint-placeholder-val="{{false}}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </sc-if>
      </button>
    </div>
  </div>

  <p class="mono" style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);margin:0;font-size:12px;color:{{t.faint}};">open source · self-hostable</p>
</div>

</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","default":"bone","options":["bone","graphite"],"section":"Theme"},"showError":{"editor":"boolean","default":false,"section":"State"}}'>
const TOKENS = {
  bone: { canvas:'#F4F2ED', surface:'#FBFAF7', border:'#D8D3C8', subtle:'#E7E3DA', ink:'#1E2126', sec:'#5C6470', faint:'#A7A399', accent:'#0FA893', accentSoft:'rgba(15,168,147,0.14)', danger:'#DE3B30', dangerBorder:'rgba(222,59,48,0.35)', dangerBg:'rgba(222,59,48,0.06)' },
  graphite: { canvas:'#262624', surface:'#30302E', border:'#45433F', subtle:'#3A3835', ink:'#ECEAE4', sec:'#A8A49C', faint:'#5C594F', accent:'#3DD6C4', accentSoft:'rgba(61,214,196,0.18)', danger:'#FF6459', dangerBorder:'rgba(255,100,89,0.35)', dangerBg:'rgba(255,100,89,0.08)' },
};
const RADIUS = { sm: '6px', md: '8px', lg: '10px', xl: '14px' };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: props.theme || 'bone' };
  }
  renderVals() {
    const mode = this.state.theme === 'graphite' ? 'graphite' : 'bone';
    return {
      t: TOKENS[mode],
      radius: RADIUS,
      isBone: mode === 'bone',
      isGraphite: mode === 'graphite',
      showError: this.props.showError ?? false,
      toggleTheme: () => this.setState({ theme: this.state.theme === 'bone' ? 'graphite' : 'bone' }),
    };
  }
}
</script>
</body>
</html>
