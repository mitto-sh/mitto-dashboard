<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
html,body{margin:0;background:#0b0d10;color:#e5e7eb;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
a{color:#e5e7eb;text-decoration:none}
input::placeholder{color:#6b7280}
</style></helmet>
<main style="max-width:672px;margin:0 auto;padding:48px 24px" data-screen-label="Current Projects">
  <h1 style="margin:0 0 24px;font-size:20px;line-height:28px;font-weight:600">Projects</h1>
  <form style="margin-bottom:32px;display:flex;gap:8px">
    <input aria-label="Project name" placeholder="New project name" style="flex:1;border-radius:4px;border:1px solid #242830;background:#14171c;padding:8px 12px;font-size:14px;line-height:20px;color:#e5e7eb;outline:none" />
    <button type="submit" style="border-radius:4px;background:#ffffff;border:none;padding:8px 16px;font-size:14px;line-height:20px;font-weight:500;color:#111827;cursor:pointer">Create</button>
  </form>
  <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
      <li>
        <a href="#" style="display:block;border-radius:8px;border:1px solid #242830;background:#14171c;padding:12px 16px" style-hover="border-color:#6b7280">
          <span style="font-weight:500">{{ p.name }}</span>
          <span style="margin-left:8px;font-size:12px;line-height:16px;color:#6b7280">{{ p.slug }}</span>
        </a>
      </li>
    </sc-for>
  </ul>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { projects: [
      { name: 'acme-api', slug: 'acme-api' },
      { name: 'marketing site', slug: 'marketing-site' },
      { name: 'internal tools', slug: 'internal-tools' },
    ]};
  }
}
</script>
</body>
</html>
