<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
html,body{margin:0;background:#0b0d10;color:#e5e7eb;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
a{color:#e5e7eb;text-decoration:none}
</style></helmet>
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6)" data-screen-label="Current Add Service Modal">
  <form style="width:320px;border-radius:8px;border:1px solid #242830;background:#14171c;padding:20px;box-sizing:border-box">
    <h2 style="margin:0 0 16px;font-size:14px;line-height:20px;font-weight:600">Add service</h2>
    <label for="service-name" style="margin-bottom:4px;display:block;font-size:12px;line-height:16px;color:#9ca3af">Name</label>
    <input id="service-name" style="margin-bottom:4px;width:100%;border-radius:4px;border:1px solid #242830;background:#0b0d10;padding:6px 8px;font-size:14px;line-height:20px;color:#e5e7eb;box-sizing:border-box;outline:none" />
    <label for="service-type" style="margin-bottom:4px;display:block;font-size:12px;line-height:16px;color:#9ca3af">Type</label>
    <select id="service-type" style="margin-bottom:4px;width:100%;border-radius:4px;border:1px solid #242830;background:#0b0d10;padding:6px 8px;font-size:14px;line-height:20px;color:#e5e7eb;box-sizing:border-box;outline:none">
      <option value="web">web</option>
      <option value="worker">worker</option>
      <option value="cron">cron</option>
      <option value="static">static</option>
    </select>
    <label for="service-port" style="margin-bottom:4px;display:block;font-size:12px;line-height:16px;color:#9ca3af">Port (optional)</label>
    <input id="service-port" style="margin-bottom:4px;width:100%;border-radius:4px;border:1px solid #242830;background:#0b0d10;padding:6px 8px;font-size:14px;line-height:20px;color:#e5e7eb;box-sizing:border-box;outline:none" />
    <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px">
      <button type="button" style="border-radius:4px;background:none;border:none;padding:6px 12px;font-size:14px;line-height:20px;color:#9ca3af;cursor:pointer" style-hover="color:#e5e7eb">Cancel</button>
      <button type="submit" style="border-radius:4px;background:#ffffff;border:none;padding:6px 12px;font-size:14px;line-height:20px;font-weight:500;color:#111827;cursor:pointer">Create</button>
    </div>
  </form>
</div>
</x-dc>
</body>
</html>
