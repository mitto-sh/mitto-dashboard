<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0A0C10;color:#E6EAF2;font-family:'IBM Plex Sans',sans-serif}
a{color:#3DD6C4;text-decoration:none}a:hover{color:#5EE8D8}
@keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:1}}
</style></helmet>
<main style="position:relative;display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:0 16px;overflow:hidden;background-image:radial-gradient(circle,#151A22 1px,transparent 1px);background-size:28px 28px" data-screen-label="Mitto Login">
  <div style="position:absolute;bottom:-220px;left:50%;transform:translateX(-50%);width:640px;height:400px;background:radial-gradient(ellipse at center,rgba(61,214,196,0.08),transparent 65%);pointer-events:none"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:20px">
    <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center">
      <div style="width:22px;height:22px;background:#3DD6C4;transform:rotate(45deg);border-radius:5px;box-shadow:0 0 24px rgba(61,214,196,0.5);animation:glowPulse 4s ease-in-out infinite"></div>
    </div>
    <div style="text-align:center">
      <h1 style="margin:0;font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500;letter-spacing:-0.01em">mitto</h1>
      <p style="margin:10px 0 0;font-size:14px;line-height:20px;color:#98A2B3;text-wrap:pretty">Deploy without managing infrastructure.</p>
    </div>
  </div>
  <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
    <p role="alert" style="margin:0;display:flex;align-items:center;gap:10px;border-radius:8px;border:1px solid rgba(255,100,89,0.35);background:rgba(255,100,89,0.08);padding:10px 16px;font-size:13px;color:#FF8A82"><span style="width:6px;height:6px;border-radius:50%;background:#FF6459;flex:none"></span>GitHub rejected the login request. Try again.</p>
  </sc-if>
  <a href="#" style="display:inline-flex;align-items:center;gap:10px;border-radius:8px;background:#E6EAF2;padding:11px 22px;font-size:14px;font-weight:600;color:#0A0C10;transition:background .15s ease,transform .15s ease" style-hover="background:#ffffff;transform:translateY(-1px)" style-active="transform:translateY(0)">Sign in with GitHub</a>
  <p style="position:absolute;bottom:28px;margin:0;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#3C4552">open source · self-hostable</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;}}">
class Component extends DCLogic {
  renderVals() { return { showError: this.props.showError ?? false }; }
}
</script>
</body>
</html>
