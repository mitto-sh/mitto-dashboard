<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
html,body{margin:0;background:#0b0d10;color:#e5e7eb;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
a{color:#e5e7eb;text-decoration:none}a:hover{color:#fff}
</style></helmet>
<main style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:0 16px" data-screen-label="Current Login">
  <div style="text-align:center">
    <h1 style="margin:0;font-size:30px;line-height:36px;font-weight:600;letter-spacing:-0.025em">Mitto</h1>
    <p style="margin:8px 0 0;font-size:14px;line-height:20px;color:#9ca3af">Deploy without managing infrastructure.</p>
  </div>
  <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
    <p role="alert" style="margin:0;border-radius:6px;border:1px solid #991b1b;background:rgba(69,10,10,0.5);padding:8px 16px;font-size:14px;line-height:20px;color:#fca5a5">GitHub rejected the login request. Try again.</p>
  </sc-if>
  <a href="#" style="border-radius:6px;background:#ffffff;padding:10px 20px;font-size:14px;line-height:20px;font-weight:500;color:#111827" style-hover="background:#e5e7eb">Sign in with GitHub</a>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { return { showError: this.props.showError ?? false }; }
}
</script>
</body>
</html>
