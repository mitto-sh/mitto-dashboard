<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0A0C10;color:#E6EAF2;font-family:'IBM Plex Sans',sans-serif}
a{color:#E6EAF2;text-decoration:none}
input::placeholder{color:#5D6878}
</style></helmet>
<div data-screen-label="Mitto Projects">
  <header style="display:flex;height:56px;align-items:center;justify-content:space-between;border-bottom:1px solid #1C212B;padding:0 24px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:11px;height:11px;background:#3DD6C4;transform:rotate(45deg);border-radius:2.5px"></div>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500">mitto</span>
    </div>
    <div style="width:28px;height:28px;border-radius:50%;background:#171B23;border:1px solid #232936"></div>
  </header>
  <main style="max-width:720px;margin:0 auto;padding:56px 24px">
    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:28px">
      <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em">Projects</h1>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5D6878">{{ count }}</span>
    </div>
    <form style="margin-bottom:36px;display:flex;gap:10px">
      <input aria-label="Project name" placeholder="New project name" style="flex:1;border-radius:8px;border:1px solid #232936;background:#12151B;padding:10px 14px;font-size:14px;color:#E6EAF2;outline:none;transition:border-color .15s ease" style-focus="border-color:#3DD6C4" />
      <button type="submit" style="border-radius:8px;background:#3DD6C4;border:none;padding:10px 18px;font-size:13px;font-weight:600;color:#062B26;cursor:pointer;transition:background .15s ease" style-hover="background:#5EE8D8">Create</button>
    </form>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="border:1px dashed #232936;border-radius:12px;padding:48px 24px;text-align:center">
        <p style="margin:0;font-size:14px;color:#98A2B3">No projects yet</p>
        <p style="margin:8px 0 0;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5D6878">create one above to get started</p>
      </div>
    </sc-if>
    <sc-if value="{{ hasProjects }}" hint-placeholder-val="{{ true }}">
      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
          <li>
            <a href="#" style="display:flex;align-items:center;justify-content:space-between;border-radius:12px;border:1px solid #1F2531;background:#12151B;padding:18px 20px;transition:border-color .15s ease,background .15s ease" style-hover="border-color:rgba(61,214,196,0.4);background:#151A23">
              <div style="display:flex;flex-direction:column;gap:5px">
                <span style="font-size:14px;font-weight:500">{{ p.name }}</span>
                <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5D6878">{{ p.slug }}</span>
              </div>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3C4552" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"></path></svg>
            </a>
          </li>
        </sc-for>
      </ul>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;emptyState&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const empty = this.props.emptyState ?? false;
    const projects = [
      { name: 'acme-api', slug: 'acme-api' },
      { name: 'marketing site', slug: 'marketing-site' },
      { name: 'internal tools', slug: 'internal-tools' },
    ];
    return { empty, hasProjects: !empty, projects, count: empty ? '0' : String(projects.length).padStart(2, '0') };
  }
}
</script>
</body>
</html>
