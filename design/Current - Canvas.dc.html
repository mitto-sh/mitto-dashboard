<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
html,body{margin:0;background:#0b0d10;color:#e5e7eb;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
a{color:#6b7280;text-decoration:none}a:hover{color:#d1d5db}
input::placeholder{color:#6b7280}
</style></helmet>
<div data-screen-label="Current Canvas">
  <header style="display:flex;height:64px;align-items:center;justify-content:space-between;border-bottom:1px solid #242830;padding:0 24px">
    <div style="display:flex;align-items:center;gap:12px">
      <a href="#" style="font-size:14px;line-height:20px">← Projects</a>
      <h1 style="margin:0;font-size:14px;line-height:20px;font-weight:600">acme-api</h1>
    </div>
    <button style="border-radius:4px;background:#ffffff;border:none;padding:6px 12px;font-size:12px;line-height:16px;font-weight:500;color:#111827;cursor:pointer">+ Add service</button>
  </header>
  <div style="position:relative;height:calc(100vh - 64px);width:100%;overflow:auto;background-color:#0b0d10;background-image:radial-gradient(circle,#1a1e24 1px,transparent 1px);background-size:24px 24px">
    <sc-for list="{{ services }}" as="s" hint-placeholder-count="4">
      <div style="position:absolute;left:{{ s.x }}px;top:{{ s.y }}px;width:240px;cursor:grab;user-select:none;border-radius:8px;border:1px solid #242830;background:#14171c;padding:16px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -4px rgba(0,0,0,0.1);box-sizing:border-box" style-hover="border-color:#6b7280">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-weight:500">{{ s.name }}</span>
          <span style="border-radius:4px;background:#1f2937;padding:2px 6px;font-size:12px;line-height:16px;color:#9ca3af">{{ s.type }}</span>
        </div>
        <div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;font-size:12px;line-height:16px;color:#6b7280">
          <span>{{ s.portLabel }}</span>
          <span style="display:inline-block;border-radius:9999px;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;background:{{ s.badgeBg }};color:{{ s.badgeFg }}">{{ s.status }}</span>
        </div>
      </div>
    </sc-for>
  </div>
  <aside style="position:fixed;right:0;top:0;height:100%;width:384px;overflow-y:auto;border-left:1px solid #242830;background:#14171c;padding:20px;box-sizing:border-box">
    <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
      <h2 style="margin:0;font-size:14px;line-height:20px;font-weight:600">gateway</h2>
      <button aria-label="Close panel" style="background:none;border:none;color:#6b7280;cursor:pointer;font-size:14px" style-hover="color:#d1d5db">✕</button>
    </div>
    <section style="margin-bottom:24px">
      <h3 style="margin:0 0 8px;font-size:12px;line-height:16px;font-weight:500;text-transform:uppercase;color:#6b7280">Deployments</h3>
      <div style="margin-bottom:8px;display:flex;align-items:center;gap:8px">
        <span style="display:inline-block;border-radius:9999px;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;background:#064e3b;color:#6ee7b7">live</span>
        <span style="font-size:12px;line-height:16px;color:#6b7280">fix: rate-limit burst window</span>
      </div>
      <div style="display:flex;gap:8px">
        <button style="border-radius:4px;background:#ffffff;border:none;padding:6px 12px;font-size:12px;line-height:16px;font-weight:500;color:#111827;cursor:pointer">Deploy</button>
      </div>
    </section>
    <section style="margin-bottom:24px">
      <h3 style="margin:0 0 8px;font-size:12px;line-height:16px;font-weight:500;text-transform:uppercase;color:#6b7280">Environment variables</h3>
      <ul style="list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:4px">
        <sc-for list="{{ envVars }}" as="v" hint-placeholder-count="3">
          <li style="display:flex;align-items:center;justify-content:space-between;font-size:12px;line-height:16px">
            <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#d1d5db">{{ v.key }}</span>
            <button style="background:none;border:none;color:#4b5563;cursor:pointer;font-size:12px" style-hover="color:#f87171">remove</button>
          </li>
        </sc-for>
      </ul>
      <form style="display:flex;gap:4px">
        <input aria-label="Env var key" placeholder="KEY" style="width:50%;border-radius:4px;border:1px solid #242830;background:#0b0d10;padding:4px 8px;font-size:12px;line-height:16px;color:#e5e7eb;box-sizing:border-box;outline:none" />
        <input aria-label="Env var value" placeholder="value" style="width:50%;border-radius:4px;border:1px solid #242830;background:#0b0d10;padding:4px 8px;font-size:12px;line-height:16px;color:#e5e7eb;box-sizing:border-box;outline:none" />
        <button type="submit" style="border-radius:4px;background:#374151;border:none;padding:4px 8px;font-size:12px;line-height:16px;color:#e5e7eb;cursor:pointer">+</button>
      </form>
    </section>
    <button style="background:none;border:none;padding:0;font-size:12px;line-height:16px;color:#f87171;cursor:pointer" style-hover="color:#fca5a5">Delete service</button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      services: [
        { name: 'gateway', type: 'web', portLabel: ':3000', status: 'live', badgeBg: '#064e3b', badgeFg: '#6ee7b7', x: 40, y: 40 },
        { name: 'worker', type: 'worker', portLabel: 'no port', status: 'building', badgeBg: '#78350f', badgeFg: '#fcd34d', x: 320, y: 140 },
        { name: 'nightly-sync', type: 'cron', portLabel: 'no port', status: 'queued', badgeBg: '#374151', badgeFg: '#e5e7eb', x: 40, y: 240 },
        { name: 'docs', type: 'static', portLabel: ':8080', status: 'failed', badgeBg: '#7f1d1d', badgeFg: '#fca5a5', x: 320, y: 340 },
      ],
      envVars: [{ key: 'DATABASE_URL' }, { key: 'REDIS_URL' }, { key: 'STRIPE_KEY' }],
    };
  }
}
</script>
</body>
</html>
